<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigia Noturna — Fangame</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <!-- HUD: energia, relógio, noite atual -->
    <div id="hud" class="hidden">
      <div id="hud-power">
        🔋 <span id="hud-power-value">100%</span>
      </div>
      <div id="hud-clock">
        🕐 <span id="hud-clock-value">12:00 AM</span>
      </div>
      <div id="hud-night">
        <span id="hud-night-value">Noite 1</span>
      </div>
    </div>

    <!-- Controles do escritório: portas, luzes, botão de câmeras -->
    <div id="office-controls" class="hidden">
      <div class="door-panel" data-door="esquerda">
        <span class="door-panel-label">Porta Esquerda</span>
        <button data-action="toggle-light" data-door="esquerda">💡 Luz</button>
        <button data-action="toggle-door" data-door="esquerda">🚪 Fechar</button>
      </div>

      <button id="btn-open-monitor" class="monitor-btn">📺 Câmeras</button>

      <div class="door-panel" data-door="direita">
        <span class="door-panel-label">Porta Direita</span>
        <button data-action="toggle-light" data-door="direita">💡 Luz</button>
        <button data-action="toggle-door" data-door="direita">🚪 Fechar</button>
      </div>
    </div>

    <!-- Monitor de câmeras -->
    <div id="camera-monitor" class="hidden">
      <div id="camera-tabs"></div>
      <button id="btn-close-monitor">✕ Fechar Monitor</button>
    </div>

    <!-- Tela de carregamento -->
    <div id="loading-screen" class="screen">
      <h1>Carregando…</h1>
    </div>

    <!-- Menu principal -->
    <div id="menu-screen" class="screen hidden">
      <h1>Vigia Noturna</h1>
      <p class="subtitle">
        Um fangame ponto-e-clique de terror noturno, com arquitetura pronta
        para você trocar todos os sprites pelas fotos da sua própria casa,
        família e pets.
      </p>
      <button id="btn-start">Começar Noite 1</button>
    </div>

    <!-- Game over -->
    <div id="gameover-screen" class="screen hidden">
      <h1>Você foi pego.</h1>
      <div class="screen-buttons">
        <button id="btn-retry">Tentar Novamente</button>
        <button id="btn-menu-gameover">Menu</button>
      </div>
    </div>

    <!-- Vitória / fim de noite -->
    <div id="victory-screen" class="screen hidden">
      <h1 id="victory-title">Noite concluída!</h1>
      <div class="screen-buttons">
        <button id="btn-next-night">Próxima Noite</button>
        <button id="btn-menu-victory">Menu</button>
      </div>
    </div>
  </div>

  <!-- Ordem importa: config primeiro, main.js por último. -->
  <script src="js/config.js"></script>
  <script src="js/assetLoader.js"></script>
  <script src="js/doors.js"></script>
  <script src="js/power.js"></script>
  <script src="js/cameras.js"></script>
  <script src="js/enemyAI.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
